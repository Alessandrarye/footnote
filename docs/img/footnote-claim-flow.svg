<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Calibri, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55607A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#FFFFFF"/>

  <!-- Title with footnote marker -->
  <text x="55" y="52" font-family="'Century Schoolbook', Georgia, serif" font-size="30" font-weight="bold" fill="#1F2A44">How a claim moves through Footnote<tspan dy="-12" font-size="17" fill="#990011"> 1</tspan></text>

  <!-- Input chip -->
  <rect x="410" y="78" width="380" height="64" rx="10" fill="#F2F2F2" stroke="#D9DDE6"/>
  <text x="600" y="104" text-anchor="middle" font-family="'Century Schoolbook', Georgia, serif" font-size="16" font-style="italic" fill="#1F2A44">&#8220;Is the levy money going to classrooms?&#8221;</text>
  <text x="600" y="126" text-anchor="middle" font-size="13" fill="#55607A">+ Delaware County, Ohio</text>

  <line x1="600" y1="148" x2="600" y2="190" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: Classify -->
  <rect x="55" y="200" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="92" cy="236" r="17" fill="#990011"/>
  <text x="92" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="117" y="242" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Classify</text>
  <text x="75" y="274" font-size="13" fill="#55607A">Claude Haiku labels the claim</text>
  <text x="75" y="294" font-size="13" fill="#55607A">factual, opinion, or mixed.</text>
  <text x="75" y="314" font-size="13" fill="#55607A">Strict JSON, validated in code.</text>

  <line x1="309" y1="280" x2="327" y2="280" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Source -->
  <rect x="335" y="200" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="372" cy="236" r="17" fill="#990011"/>
  <text x="372" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="397" y="242" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Source</text>
  <text x="355" y="274" font-size="13" fill="#55607A">Gathers primary records for</text>
  <text x="355" y="294" font-size="13" fill="#55607A">the locality as candidate</text>
  <text x="355" y="314" font-size="13" fill="#55607A">sources for the claim.</text>

  <line x1="589" y1="280" x2="607" y2="280" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Policy -->
  <rect x="615" y="200" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="652" cy="236" r="17" fill="#990011"/>
  <text x="652" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="677" y="242" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Policy</text>
  <text x="635" y="274" font-size="13" fill="#55607A">The citation policy keeps or</text>
  <text x="635" y="294" font-size="13" fill="#55607A">rejects each source by tier,</text>
  <text x="635" y="314" font-size="13" fill="#55607A">verified date, and provenance.</text>

  <line x1="869" y1="280" x2="887" y2="280" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Invite -->
  <rect x="895" y="200" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="932" cy="236" r="17" fill="#990011"/>
  <text x="932" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="957" y="242" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Invite</text>
  <text x="915" y="274" font-size="13" fill="#55607A">Ends with a real next step:</text>
  <text x="915" y="294" font-size="13" fill="#55607A">officials, meetings, and</text>
  <text x="915" y="314" font-size="13" fill="#55607A">organizations near you.</text>

  <!-- Dotted connectors to transparency band -->
  <line x1="180" y1="360" x2="180" y2="408" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="460" y1="360" x2="460" y2="408" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="740" y1="360" x2="740" y2="408" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="1020" y1="360" x2="1020" y2="408" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>

  <!-- Transparency band -->
  <rect x="55" y="408" width="1090" height="62" rx="8" fill="#F2F2F2"/>
  <rect x="55" y="408" width="6" height="62" rx="3" fill="#990011"/>
  <text x="82" y="434" font-family="'Century Schoolbook', Georgia, serif" font-size="17" font-weight="bold" fill="#1F2A44">Transparency record</text>
  <text x="82" y="456" font-size="13" fill="#55607A">written by every stage: model and latency, sources kept and rejected, policy rulings, verified dates</text>

  <line x1="600" y1="474" x2="600" y2="514" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <rect x="70" y="524" width="330" height="112" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <text x="90" y="558" font-family="'Century Schoolbook', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2A44">Source card</text>
  <text x="90" y="584" font-size="13" fill="#55607A">What the records say, cited to</text>
  <text x="90" y="604" font-size="13" fill="#55607A">primary sources under policy.</text>

  <rect x="435" y="524" width="330" height="112" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <text x="455" y="558" font-family="'Century Schoolbook', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2A44">Civic invitation</text>
  <text x="455" y="584" font-size="13" fill="#55607A">Who to contact and where to</text>
  <text x="455" y="604" font-size="13" fill="#55607A">show up in your community.</text>

  <rect x="800" y="524" width="330" height="112" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <text x="820" y="558" font-family="'Century Schoolbook', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2A44">Transparency panel</text>
  <text x="820" y="584" font-size="13" fill="#55607A">How the answer was assembled,</text>
  <text x="820" y="604" font-size="13" fill="#55607A">stage by stage, nothing hidden.</text>

  <!-- Evaporation note -->
  <rect x="310" y="668" width="580" height="44" rx="22" fill="none" stroke="#999999" stroke-dasharray="5,5"/>
  <text x="600" y="696" text-anchor="middle" font-size="14" font-style="italic" fill="#55607A">Then the session evaporates. No profiles, no tracking, no ads.</text>
</svg>
