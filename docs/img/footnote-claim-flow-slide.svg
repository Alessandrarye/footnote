<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Calibri, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55607A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="48" font-family="'Century Schoolbook', Georgia, serif" font-size="30" font-weight="bold" fill="#1F2A44">How a claim moves through Footnote<tspan dy="-12" font-size="17" fill="#990011"> 1</tspan></text>

  <!-- Input chip -->
  <rect x="450" y="70" width="380" height="60" rx="10" fill="#F2F2F2" stroke="#D9DDE6"/>
  <text x="640" y="95" text-anchor="middle" font-family="'Century Schoolbook', Georgia, serif" font-size="16" font-style="italic" fill="#1F2A44">&#8220;Is the levy money going to classrooms?&#8221;</text>
  <text x="640" y="117" text-anchor="middle" font-size="13" fill="#55607A">+ Delaware County, Ohio</text>

  <line x1="640" y1="136" x2="640" y2="164" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <rect x="57" y="174" width="272" height="156" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="93" cy="208" r="17" fill="#990011"/>
  <text x="93" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="118" y="214" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Classify</text>
  <text x="77" y="246" font-size="13" fill="#55607A">Claude Haiku labels the claim</text>
  <text x="77" y="266" font-size="13" fill="#55607A">factual, opinion, or mixed.</text>
  <text x="77" y="286" font-size="13" fill="#55607A">Strict JSON, validated in code.</text>

  <line x1="333" y1="252" x2="351" y2="252" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="355" y="174" width="272" height="156" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="391" cy="208" r="17" fill="#990011"/>
  <text x="391" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="416" y="214" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Source</text>
  <text x="375" y="246" font-size="13" fill="#55607A">Gathers primary records for</text>
  <text x="375" y="266" font-size="13" fill="#55607A">the locality as candidate</text>
  <text x="375" y="286" font-size="13" fill="#55607A">sources for the claim.</text>

  <line x1="631" y1="252" x2="649" y2="252" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="653" y="174" width="272" height="156" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="689" cy="208" r="17" fill="#990011"/>
  <text x="689" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="714" y="214" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Policy</text>
  <text x="673" y="246" font-size="13" fill="#55607A">The citation policy keeps or</text>
  <text x="673" y="266" font-size="13" fill="#55607A">rejects each source by tier,</text>
  <text x="673" y="286" font-size="13" fill="#55607A">verified date, and provenance.</text>

  <line x1="929" y1="252" x2="947" y2="252" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="951" y="174" width="272" height="156" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <circle cx="987" cy="208" r="17" fill="#990011"/>
  <text x="987" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="1012" y="214" font-family="'Century Schoolbook', Georgia, serif" font-size="19" font-weight="bold" fill="#1F2A44">Invite</text>
  <text x="971" y="246" font-size="13" fill="#55607A">Ends with a real next step:</text>
  <text x="971" y="266" font-size="13" fill="#55607A">officials, meetings, and</text>
  <text x="971" y="286" font-size="13" fill="#55607A">organizations near you.</text>

  <!-- Dotted connectors -->
  <line x1="193" y1="330" x2="193" y2="372" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="491" y1="330" x2="491" y2="372" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="789" y1="330" x2="789" y2="372" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="1087" y1="330" x2="1087" y2="372" stroke="#999999" stroke-width="1.2" stroke-dasharray="3,4"/>

  <!-- Transparency band -->
  <rect x="57" y="372" width="1166" height="58" rx="8" fill="#F2F2F2"/>
  <rect x="57" y="372" width="6" height="58" rx="3" fill="#990011"/>
  <text x="84" y="396" font-family="'Century Schoolbook', Georgia, serif" font-size="17" font-weight="bold" fill="#1F2A44">Transparency record</text>
  <text x="84" y="418" font-size="13" fill="#55607A">written by every stage: model and latency, sources kept and rejected, policy rulings, verified dates</text>

  <line x1="640" y1="434" x2="640" y2="468" stroke="#55607A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <rect x="76" y="478" width="356" height="104" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <text x="96" y="510" font-family="'Century Schoolbook', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2A44">Source card</text>
  <text x="96" y="536" font-size="13" fill="#55607A">What the records say, cited to</text>
  <text x="96" y="556" font-size="13" fill="#55607A">primary sources under policy.</text>

  <rect x="462" y="478" width="356" height="104" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <text x="482" y="510" font-family="'Century Schoolbook', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2A44">Civic invitation</text>
  <text x="482" y="536" font-size="13" fill="#55607A">Who to contact and where to</text>
  <text x="482" y="556" font-size="13" fill="#55607A">show up in your community.</text>

  <rect x="848" y="478" width="356" height="104" rx="10" fill="#FFFFFF" stroke="#D9DDE6" stroke-width="1.5"/>
  <text x="868" y="510" font-family="'Century Schoolbook', Georgia, serif" font-size="18" font-weight="bold" fill="#1F2A44">Transparency panel</text>
  <text x="868" y="536" font-size="13" fill="#55607A">How the answer was assembled,</text>
  <text x="868" y="556" font-size="13" fill="#55607A">stage by stage, nothing hidden.</text>

  <!-- Evaporation note -->
  <rect x="350" y="622" width="580" height="42" rx="21" fill="none" stroke="#999999" stroke-dasharray="5,5"/>
  <text x="640" y="649" text-anchor="middle" font-size="14" font-style="italic" fill="#55607A">Then the session evaporates. No profiles, no tracking, no ads.</text>

  <text x="1223" y="706" text-anchor="end" font-size="11" fill="#8A93A6">footnote.alessandrarye.com</text>
</svg>
